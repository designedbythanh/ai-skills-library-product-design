schema_version: "1"
name: critique-06-off-scale-values
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Write, Glob, Grep, Bash]
  prompt: |
    Can you critique the Candidates list in Northbeam, a recruiting agency's hiring tool? The mockup is `mockup/candidates.html`, about to go to engineering. Desktop shows a table; below 640px each candidate becomes a card.

    Goal: a recruiter scans who to move forward today. Users: agency recruiters, on a laptop at their desk and on their phone between calls.
    Decided: cards below 640px, one action per candidate, the stage filter stays a row of chips.
    Open: nothing else.
    My concern: the filter chips feel cluttered.
