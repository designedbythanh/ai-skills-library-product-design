schema_version: "1"
name: context-07-known-and-rejected
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Write, Glob, Bash]
  prompt: |
    Can you pretest the Candidates list with a recruiter persona? The list is a table: candidate name, role, a Stage pill (Screening is a yellow pill), a Progress column ("Screening in progress", "Interview booked", "Offer sent") and a ⋯ menu with Archive. A Stage filter takes one value at a time. The recruiter's task: on Monday morning, find which candidates need them this week.
