schema_version: "1"
name: context-04-edge-writes-log
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Write, Glob, Bash]
  prompt: |
    What breaks in our team invites flow? An admin opens Settings > Team, types one or more email addresses, picks a role (Admin / Member / Viewer) and clicks Send invites. The invitee gets an email link, sets a password and lands in the workspace. In the current build the role is read from the URL (?role=admin), the team list is 3 hard-coded people, and Send shows a toast without sending anything.
