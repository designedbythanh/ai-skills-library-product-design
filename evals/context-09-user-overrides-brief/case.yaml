schema_version: "1"
name: context-09-user-overrides-brief
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Skill, Read, Write, Edit, Glob, Bash]
  prompt: |
    What breaks in the candidate archive flow? It goes to production on Monday. On the Candidates list, a recruiter opens a row's ⋯ menu and picks Archive. The candidate disappears from the list at once, with an Undo toast. A "Show archived" switch above the list brings archived candidates back in grey, with a Restore action. For now the recruiter's role is read from the URL.
