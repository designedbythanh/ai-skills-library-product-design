name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skills, manifests and links
        run: python3 scripts/check_repo.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plugin and marketplace manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
