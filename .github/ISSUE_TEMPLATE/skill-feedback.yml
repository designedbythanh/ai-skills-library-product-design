name: Skill feedback
description: Tell us how a skill worked on your real work
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Which skill did you use?
      options:
        - five-whys-root-cause
        - user-interview-synthesis
        - persona-pretest
        - assumption-reversal
        - cross-industry-steal
        - decision-rationale
        - prd-first-draft
        - success-metrics-definition
        - edge-case-finder
        - acceptance-criteria
        - design-critique-facilitator
        - explain-to-4-audiences
        - design-scope-negotiator
        - experiment-design
        - data-interpretation
  - type: input
    id: version
    attributes:
      label: Which version? (optional)
      description: If you know it, e.g. 1.1.0. It's in the plugin, or in the release you downloaded the zip from.
  - type: dropdown
    id: tool
    attributes:
      label: Which AI tool?
      options:
        - Claude (claude.ai / Desktop)
        - Claude Code
        - ChatGPT
        - Gemini
        - Other
  - type: textarea
    id: task
    attributes:
      label: What were you working on?
      description: One or two sentences. Leave out anything confidential.
    validations:
      required: true
  - type: dropdown
    id: useful
    attributes:
      label: Could you use the output as it was?
      options:
        - Yes, as is
        - Yes, after small edits
        - Partly
        - No
  - type: textarea
    id: missing
    attributes:
      label: What was missing or wrong?
  - type: textarea
    id: output
    attributes:
      label: Output you'd like to share (optional)
      description: If it's good, we may add it as a real example, with your permission.
